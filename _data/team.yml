# Lab members. They share one grid of cards, in the order below, and each card
# shows the person's role under the name. A role with no people is skipped,
# and the "Waiting for YOU" card always ends the grid.
# To add someone, put them under `people`, for example:
#     people:
#       - name: "Gildong Hong"
#         photo: /assets/img/team/gildong-hong.webp   # optional
#         email: "gildong@pusan.ac.kr"                  # optional
members:
  - role: "Ph.D. Student"
    people: []
  - role: "M.S. Student"
    people: []
  - role: "Undergraduate Researcher"
    people: []

# Former members, e.g.  - name: "..."  note: "M.S. 2028, now at ..."
alumni: []

# The last card of the grid: a place for future members.
open_card:
  title: "Waiting for YOU"
  note: "Send your CV to"     # the lab email is shown below it
